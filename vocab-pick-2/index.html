<html lang="en"><head>
<script>
/* جسر المدارس: إرسال نتائج النشاط الحقيقي إلى صفحة الجسر التي فتحته. */
(function () {
  "use strict";
  const activityId = "vocab-pick-2";
  const bridgeOrigin = "https://jisr-almadaris.github.io";
  const sessionId = new URLSearchParams(window.location.hash.slice(1)).get("sb_session");
  let channel = null;
  try {
    if (sessionId && typeof BroadcastChannel === "function") {
      channel = new BroadcastChannel("schools-bridge-session-v1::" + sessionId);
    }
  } catch (error) { channel = null; }
  let reportedCompleted = false;
  let reportedCertificate = false;
  function send(type, values) {
    const message = {
      source: "schools-bridge-game", activityId, type,
      ...(sessionId ? { sessionId } : {}),
      ...(values || {})
    };
    try { if (channel) channel.postMessage(message); } catch (_) {}
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(message, bridgeOrigin);
      }
    } catch (_) {}
  }
  const reporter = {
    completed(score, maxScore) {
      score = Number(score); maxScore = Number(maxScore);
      if (reportedCompleted || !Number.isFinite(score) || !Number.isFinite(maxScore) ||
          maxScore <= 0 || score < 0 || score > maxScore) return;
      reportedCompleted = true;
      send("completed", {score, maxScore});
    },
    certificate(percent) {
      percent = Number(percent);
      if (reportedCertificate || !Number.isFinite(percent) || percent < 80 || percent > 100) return;
      reportedCertificate = true;
      send("certificate", {score: percent});
    }
  };
  Object.defineProperty(window, "JisrVocabularyReporter", {value: Object.freeze(reporter)});
  if (channel) {
    channel.onmessage = event => {
      const d = event.data;
      if (d && d.source === "schools-bridge-host" && d.type === "identity" &&
          d.activityId === activityId && d.sessionId === sessionId) {
        window.JisrBridgeIdentity = {name: d.name, school: d.school};
      }
    };
  }
  window.addEventListener("message", event => {
    const d = event.data;
    if (event.origin !== bridgeOrigin || !d || d.source !== "schools-bridge-host" ||
        d.type !== "identity" || d.activityId !== activityId) return;
    window.JisrBridgeIdentity = {name: d.name, school: d.school};
  });
  send("ready");
})();
</script>
