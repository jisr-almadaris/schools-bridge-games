name: Deploy Bridge Games
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for dir in game-*; do
            if [[ ! -f "$dir/package.json" ]]; then continue; fi
            (cd "$dir" && npm ci --no-audit --no-fund && npm run build -- --base="/schools-bridge-games/$dir/")
            test -f "$dir/dist/index.html"
            mkdir -p "_site/$dir"
            cp -R "$dir/dist/." "_site/$dir/"
          done
          # Publish the three static vocabulary games without rebuilding or changing older games.
          for dir in vocab-pick-1 vocab-pick-2 vocab-spell-3; do
            test -f "$dir/index.html"
            mkdir -p "_site/$dir"
            cp -R "$dir/." "_site/$dir/"
          done
          test -f _site/vocab-pick-1/index.html
          test -f _site/vocab-pick-2/index.html
          test -f _site/vocab-spell-3/index.html
          test -f _site/game-comarisons/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
